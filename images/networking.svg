  <line x1="20" y1="32" x2="44" y2="32" />
  <line x1="32" y1="20" x2="32" y2="44" />
  
  <!-- 8 Radial Spokes & Outer Nodes -->
  <!-- Top -->
  <line x1="32" y1="20" x2="32" y2="11" />
  <circle cx="32" cy="7.5" r="3.2" />
  
  <!-- Bottom -->
  <line x1="32" y1="44" x2="32" y2="53" />
  <circle cx="32" cy="56.5" r="3.2" />
  
  <!-- Right -->
  <line x1="44" y1="32" x2="53" y2="32" />
