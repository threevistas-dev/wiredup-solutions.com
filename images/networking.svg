  <circle cx="14.2" cy="14.2" r="3.2" />
  
  <!-- Bottom-Right -->
  <line x1="40.5" y1="40.5" x2="47.5" y2="47.5" />
  <circle cx="49.8" cy="49.8" r="3.2" />
  
  <!-- Bottom-Left -->
  <line x1="23.5" y1="40.5" x2="16.5" y2="47.5" />
  <circle cx="14.2" cy="49.8" r="3.2" />
</svg>
